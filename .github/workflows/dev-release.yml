name: Dev Build (null0x686F QoL)

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  move-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move floating 'dev-latest' tag to this build
        run: |
          git tag -f dev-latest
          git push origin dev-latest --force

  publish:
    needs: move-tag
    permissions:
      contents: write
    uses: lucashort7/PZmodB42_null0x686F-Suite/.github/workflows/mod-release.yml@main
    with:
      mod_id: null0x686F_QoL
      tag_name: dev-latest
      publish_steam: false
      prerelease: true
    secrets: inherit
